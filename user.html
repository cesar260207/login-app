<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Usuario</title>

  <style>
    body {
      font-family: Arial;
      background: #f5f7fa;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    h1 {
      margin-bottom: 20px;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #ff4d4d;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #e60000;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Bienvenido <span id="nombreUsuario"></span> 👋</h1>
    <button id="logout">Cerrar sesión</button>
  </div>

  <script src="js/user.js"></script>
</body>
</html>
