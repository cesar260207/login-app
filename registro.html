<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #43e97b, #38f9d7);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
    }

    .container {
      background: white;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      width: 320px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #43e97b;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #2ecc71;
    }

    #error {
      color: red;
      margin-top: 10px;
    }

    a {
      display: block;
      margin-top: 15px;
      text-decoration: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Registro</h2>

    <form id="formRegistro">
      <input type="text" id="nombre" placeholder="Nombre completo">
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Contraseña">
      <input type="password" id="repetirPassword" placeholder="Repetir contraseña">
      <button type="submit">Registrarse</button>
    </form>

    <p id="error"></p>

    <a href="login.html">Volver al login</a>
  </div>

  <script src="js/registro.js"></script>
</body>
</html>
